[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finmind"
version = "0.1.0"
description = "FinMind - SEC filing intelligence platform"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.5",
    "unstructured>=0.10",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
